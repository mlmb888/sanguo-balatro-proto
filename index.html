<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>三国组字 · 试玩</title>
<meta name="sg-proto-v" content="7" />
<style>
:root {
  --bg: #1a1410;
  --paper: #f3e6c8;
  --ink: #2a1f14;
  --gold: #c9a227;
  --wei: #3a5a9a;
  --shu: #9a3a3a;
  --wu: #3a7a4a;
  --qun: #6a5a3a;
  --panel: rgba(243,230,200,.08);
  --border: rgba(201,162,39,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; background: var(--bg); color: var(--paper);
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  overflow: hidden; user-select: none;
}
body {
  display: flex; justify-content: center; align-items: stretch;
  background: radial-gradient(ellipse at 50% 0%, #2a2218 0%, #1a1410 55%, #0e0a08 100%);
}
#app {
  width: 100%; max-width: 430px; height: 100%; max-height: 100dvh;
  display: flex; flex-direction: column; position: relative;
  padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
}
.ink-wash {
  position: absolute; inset: 0; pointer-events: none; opacity: .12; z-index: 0;
  background:
    radial-gradient(circle at 20% 30%, #000 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, #000 0%, transparent 35%);
}
.screen { display: none; flex-direction: column; flex: 1; min-height: 0; z-index: 1; position: relative; }
.screen.active { display: flex; }

#title { justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 24px; }
#title h1 {
  font-size: 2rem; letter-spacing: .25em; color: var(--gold);
  text-shadow: 0 2px 0 #000, 0 0 24px rgba(201,162,39,.4);
  font-family: "Songti SC", "Noto Serif SC", serif;
}
#title .sub { opacity: .7; font-size: .88rem; line-height: 1.6; max-width: 300px; }

.btn {
  appearance: none; border: 1px solid var(--gold);
  background: linear-gradient(180deg, #3a2e1a, #241a10);
  color: var(--paper); padding: 12px 28px; border-radius: 8px; font-size: 1rem;
  letter-spacing: .15em; cursor: pointer;
}
.btn.primary { background: linear-gradient(180deg, #6a4a1a, #3a2810); box-shadow: 0 0 16px rgba(201,162,39,.25); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.ghost { background: transparent; }
.btn.small { padding: 8px 14px; font-size: .85rem; letter-spacing: .08em; }

.hud {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
  padding: 8px 4px 4px; flex-shrink: 0; font-size: .78rem;
}
.hud .full { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; }
.hud .label { opacity: .55; }
.hud .val { color: var(--gold); font-weight: 700; }
.progress-wrap {
  grid-column: 1 / -1;
  background: rgba(0,0,0,.35); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px 8px;
}
.progress-wrap .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.progress-wrap .big { color: var(--gold); font-weight: 700; font-size: 1.05rem; }
.progress-wrap .bar { height: 8px; border-radius: 4px; background: rgba(243,230,200,.12); overflow: hidden; }
.progress-wrap .bar > i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, #8a5a18, var(--gold));
  transition: width .3s ease;
}
.boss-rule {
  margin: 4px 0; padding: 6px 10px; border-radius: 8px;
  border: 1px solid rgba(180,60,60,.5); background: rgba(120,30,30,.25);
  font-size: .75rem; color: #f0b0b0; flex-shrink: 0;
}
.power-panel {
  margin: 6px 0; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--panel);
  text-align: center; flex-shrink: 0;
}
.power-panel .eq {
  font-size: 1.35rem; font-weight: 800; color: #fff;
  text-shadow: 0 0 16px rgba(201,162,39,.45);
}
.power-panel .eq .x { color: var(--gold); margin: 0 .15em; }
.power-panel .muted { opacity: .55; font-size: .72rem; margin-top: 4px; }
.power-panel .pop { animation: pop .45s ease; }
@keyframes pop {
  0% { transform: scale(.7); opacity: .3; }
  50% { transform: scale(1.12); }
  100% { transform: scale(1); opacity: 1; }
}

.hint-line {
  text-align: center; font-size: .72rem; opacity: .5; padding: 2px 4px 6px; flex-shrink: 0;
}

.board {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 4px 2px 8px; flex: 1; align-content: center; min-height: 0;
}
.slot {
  aspect-ratio: 1; border-radius: 10px;
  border: 1.5px dashed rgba(201,162,39,.25);
  background: rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center;
  position: relative; cursor: pointer;
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.slot.filled {
  border-style: solid; border-color: #c4a86a;
  background: linear-gradient(165deg, #f7ecd2, #e8d5a8);
  color: var(--ink);
  box-shadow: 0 3px 8px rgba(0,0,0,.35);
}
.slot.selected {
  transform: scale(1.06);
  box-shadow: 0 0 0 2px var(--gold), 0 8px 18px rgba(201,162,39,.4);
}
.slot.can-merge {
  box-shadow: 0 0 0 2px rgba(201,162,39,.55), 0 0 14px rgba(201,162,39,.35);
}
.slot.merge-flash { animation: mergeFlash .5s ease; }
@keyframes mergeFlash {
  0% { transform: scale(.85); filter: brightness(1.6); }
  100% { transform: scale(1); filter: brightness(1); }
}
.slot .char {
  font-size: 1.55rem; font-weight: 800;
  font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
  line-height: 1; text-align: center; padding: 2px;
  word-break: break-all;
}
.slot .char.long { font-size: 1.05rem; letter-spacing: .05em; }
.slot .meta {
  position: absolute; left: 4px; right: 4px; bottom: 3px;
  display: flex; justify-content: space-between; font-size: .55rem;
  font-family: "PingFang SC", sans-serif; opacity: .75;
}
.slot.hero-shu { border-color: #cc7a7a; }
.slot.hero-wei { border-color: #7a9acc; }
.slot.hero-wu { border-color: #7acc8a; }
.slot.hero-qun { border-color: #bba86a; }
.slot.hero .char { color: #6a3a10; }

.actions {
  display: flex; gap: 8px; padding: 6px 4px 10px; flex-shrink: 0; justify-content: center; flex-wrap: wrap;
}
.toast {
  position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.88); color: var(--gold); padding: 10px 18px;
  border-radius: 8px; border: 1px solid var(--border); z-index: 40;
  font-size: .9rem; display: none; max-width: 90%; text-align: center;
}
.toast.show { display: block; animation: fadeup 1.6s ease forwards; }
@keyframes fadeup {
  0% { opacity: 0; transform: translate(-50%, 8px); }
  15% { opacity: 1; transform: translate(-50%, 0); }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

.overlay {
  position: absolute; inset: 0; background: rgba(10,8,6,.9);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 30; padding: 24px; text-align: center; gap: 12px;
}
.overlay.active { display: flex; }
.overlay h2 { color: var(--gold); font-size: 1.5rem; letter-spacing: .2em; }
.overlay p { opacity: .85; font-size: .92rem; line-height: 1.55; max-width: 320px; }
.tut-card {
  background: linear-gradient(180deg, #2a2218, #1a1410);
  border: 1px solid var(--gold); border-radius: 14px; padding: 22px 20px;
  max-width: 320px; width: 92%; text-align: left;
}
.tut-card h3 { color: var(--gold); letter-spacing: .12em; margin-bottom: 10px; }
.tut-card p { opacity: .9; margin-bottom: 14px; }
.tut-actions { display: flex; gap: 8px; justify-content: flex-end; }

.ink-flash {
  position: absolute; inset: 0; z-index: 50; display: none;
  align-items: center; justify-content: center; pointer-events: none;
  background: radial-gradient(circle at 50% 45%, rgba(201,162,39,.32), rgba(10,8,6,.85) 55%);
}
.ink-flash.show { display: flex; animation: inkFlash .95s ease forwards; }
.ink-flash .ink-name {
  font-size: 2.8rem; font-weight: 900; color: #f3e6c8; letter-spacing: .3em;
  font-family: "Songti SC", "Noto Serif SC", serif;
  text-shadow: 0 0 28px rgba(201,162,39,.85), 2px 3px 0 #3a2810;
  transform: rotate(-5deg);
}
@keyframes inkFlash {
  0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; }
}
#app.shake { animation: shake .4s ease; }
@keyframes shake {
  0%,100%{transform:translate(0,0)} 25%{transform:translate(-3px,2px)} 50%{transform:translate(4px,-2px)} 75%{transform:translate(-2px,-1px)}
}
</style>
</head>
<body>
<div id="app">
  <div class="ink-wash"></div>

  <div id="title" class="screen active">
    <h1>三国组字</h1>
    <div class="sub">v0.7 · 合成养成<br/>点两格合成 · 拼出武将叠战力</div>
    <button class="btn primary" id="btn-start">开 始 试 玩</button>
    <div class="sub" style="margin-top:8px;font-size:.75rem">无扑克 · 无塔防 · 水墨汉字</div>
  </div>

  <div id="game" class="screen">
    <div class="hud">
      <div class="full"><span class="label" id="stage-name">黄巾</span><span class="val" id="draws">抽字 14</span></div>
      <div class="progress-wrap">
        <div class="row"><span class="label">战力 / 目标</span><span class="big"><span id="power">0</span> / <span id="target">80</span></span></div>
        <div class="bar"><i id="power-bar"></i></div>
      </div>
    </div>
    <div id="boss-rule" class="boss-rule" style="display:none"></div>
    <div class="power-panel">
      <div class="eq" id="power-eq">0 <span class="x">×</span> 1 <span class="x">=</span> 0</div>
      <div class="muted" id="power-note">底分合计 × 倍率合计（至少×1）</div>
    </div>
    <div class="hint-line" id="hint">点选两格合成：同字升阶，或 关+羽 成将</div>
    <div class="board" id="board"></div>
    <div class="actions">
      <button class="btn primary" id="btn-draw">抽 一字</button>
      <button class="btn" id="btn-clear-sel">取消选择</button>
    </div>
  </div>

  <div id="result" class="overlay">
    <h2 id="result-title">破关</h2>
    <p id="result-body"></p>
    <button class="btn primary" id="btn-result">继续</button>
  </div>

  <div id="tutorial" class="overlay">
    <div class="tut-card">
      <div class="steps" id="tut-steps" style="opacity:.5;font-size:.75rem;margin-bottom:8px">1 / 3</div>
      <h3 id="tut-title">①</h3>
      <p id="tut-body"></p>
      <div class="tut-actions">
        <button class="btn small ghost" id="btn-tut-skip">跳过</button>
        <button class="btn small primary" id="btn-tut-next">下一步</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="ink-flash" id="ink-flash"><div class="ink-name" id="ink-name">关羽</div></div>
</div>

<script type="module">
import {
  COLS, ROWS, SLOT_COUNT, STAGES, UNIT_STATS,
  emptyBoard, spawnInto, tryMerge, effectivePower, makeUnit, calcPower, resetUid,
} from './merge-logic.mjs';

const $ = (id) => document.getElementById(id);
const LS_TUT = 'sg_merge_tut_v7';

const TUT = [
  { title: '① 抽字入格', body: '点「抽一字」把汉字填进空槽（4×3）。兵/刀可升阶，关/羽等用来拼武将。' },
  { title: '② 点两格合成', body: '先点一格再点另一格：两相同→升阶（兵→锐→将）；关+羽→关羽。拖拽也可（按住滑向目标格）。' },
  { title: '③ 战力=底分×倍率', body: '武将留在场上提供底分与倍率。凑够目标战力即破关。虎牢关必须场上有武将。' },
];

const state = {
  stageIdx: 0,
  slots: emptyBoard(),
  drawsLeft: 0,
  selected: -1,
  phase: 'title',
  busy: false,
};

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function showInk(name) {
  $('ink-name').textContent = name;
  const box = $('ink-flash');
  box.classList.remove('show');
  void box.offsetWidth;
  box.classList.add('show');
  const app = $('app');
  app.classList.remove('shake');
  void app.offsetWidth;
  app.classList.add('shake');
  setTimeout(() => box.classList.remove('show'), 950);
  setTimeout(() => app.classList.remove('shake'), 450);
}

function currentPower() {
  return effectivePower(state.slots, STAGES[state.stageIdx]);
}

function renderHUD() {
  const st = STAGES[state.stageIdx];
  const p = currentPower();
  $('stage-name').textContent = st.name;
  $('draws').textContent = '抽字 ' + state.drawsLeft;
  $('target').textContent = st.target;
  $('power').textContent = p.power;
  const pct = Math.min(100, Math.round((p.power / st.target) * 100));
  $('power-bar').style.width = pct + '%';
  const eq = $('power-eq');
  eq.classList.remove('pop');
  void eq.offsetWidth;
  eq.classList.add('pop');
  eq.innerHTML = `${p.baseSum} <span class="x">×</span> ${p.mult} <span class="x">=</span> ${p.power}`;
  let note = '底分合计 × 倍率合计（至少×1）';
  if (p.blocked) note = '虎牢关：场上无武将，战力不计';
  $('power-note').textContent = note;
  const br = $('boss-rule');
  if (st.boss) {
    br.style.display = '';
    br.textContent = st.boss.text;
  } else br.style.display = 'none';
  $('hint').textContent = st.hint + (state.selected >= 0 ? ' · 再点目标格合成' : ' · 点一格选中');
  $('btn-draw').disabled = state.drawsLeft <= 0 || state.phase !== 'play' || !state.slots.some(s => !s);
}

function canMergeWith(i, j) {
  if (i < 0 || j < 0 || i === j) return false;
  return tryMerge(state.slots, i, j).ok;
}

function renderBoard() {
  const el = $('board');
  el.innerHTML = '';
  for (let i = 0; i < SLOT_COUNT; i++) {
    const u = state.slots[i];
    const div = document.createElement('div');
    div.className = 'slot';
    div.dataset.i = String(i);
    if (u) {
      div.classList.add('filled');
      if (u.kind === 'hero') {
        div.classList.add('hero');
        if (u.faction) div.classList.add('hero-' + u.faction);
      }
      if (state.selected === i) div.classList.add('selected');
      else if (state.selected >= 0 && canMergeWith(state.selected, i)) div.classList.add('can-merge');
      const long = u.name.length >= 3;
      const stars = u.star > 1 ? '★'.repeat(u.star) : '';
      const m = (u.mult || 0) + (u.multBonus || 0);
      div.innerHTML = `
        <div class="char${long ? ' long' : ''}">${u.name}</div>
        <div class="meta"><span>${u.base}${stars ? ' ' + stars : ''}</span><span>${m ? '×' + m : ''}</span></div>`;
    }
    // tap
    div.addEventListener('click', () => onTapSlot(i));
    // simple drag: pointer
    div.addEventListener('pointerdown', (e) => {
      if (!state.slots[i] || state.phase !== 'play') return;
      div.setPointerCapture?.(e.pointerId);
      state._dragFrom = i;
    });
    div.addEventListener('pointerup', (e) => {
      if (state._dragFrom == null) return;
      const from = state._dragFrom;
      state._dragFrom = null;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const slot = target && target.closest ? target.closest('.slot') : null;
      if (!slot) return;
      const to = Number(slot.dataset.i);
      if (from !== to && state.slots[to]) {
        state.selected = from;
        doMerge(from, to);
      }
    });
    el.appendChild(div);
  }
}

function renderAll() {
  renderHUD();
  renderBoard();
}

function onTapSlot(i) {
  if (state.phase !== 'play' || state.busy) return;
  const u = state.slots[i];
  if (state.selected < 0) {
    if (!u) { toast('空槽：先抽字'); return; }
    state.selected = i;
    renderAll();
    return;
  }
  if (state.selected === i) {
    state.selected = -1;
    renderAll();
    return;
  }
  if (!u) {
    toast('目标格是空的');
    return;
  }
  doMerge(state.selected, i);
}

function doMerge(i, j) {
  if (state.busy) return;
  const r = tryMerge(state.slots, i, j);
  if (!r.ok) {
    toast(r.reason === 'max_tier' ? '已满阶，换个组合' : '这两个合不成');
    state.selected = -1;
    renderAll();
    return;
  }
  state.busy = true;
  state.slots = r.slots;
  state.selected = -1;
  renderAll();

  // flash target
  const node = document.querySelector(`.slot[data-i="${j}"]`);
  if (node) {
    node.classList.add('merge-flash');
    setTimeout(() => node.classList.remove('merge-flash'), 500);
  }

  if (r.kind === 'spell' && r.result.kind === 'hero') {
    showInk(r.result.name);
    toast('组字成功 · ' + r.result.name);
  } else if (r.kind === 'star') {
    showInk(r.result.name + '★' + r.result.star);
    toast(r.result.name + ' 升至 ' + r.result.star + ' 星');
  } else {
    toast(r.reason);
  }

  setTimeout(() => {
    state.busy = false;
    checkWin();
  }, r.kind === 'spell' ? 550 : 280);
}

function doDraw() {
  if (state.phase !== 'play' || state.busy) return;
  if (state.drawsLeft <= 0) { toast('抽字用尽'); checkWin(true); return; }
  if (!state.slots.some(s => !s)) { toast('棋盘已满，先合成腾空'); return; }
  const { slots, spawned } = spawnInto(state.slots);
  if (!spawned) { toast('无法抽字'); return; }
  state.slots = slots;
  state.drawsLeft--;
  state.selected = -1;
  toast('抽到「' + spawned.name + '」');
  renderAll();
  if (state.drawsLeft <= 0) {
    // last chance: maybe already won
    checkWin(true);
  }
}

function checkWin(forceEnd = false) {
  const st = STAGES[state.stageIdx];
  const p = currentPower();
  if (p.power >= st.target) {
    state.phase = 'result';
    $('result-title').textContent = '破关！';
    $('result-body').textContent = `${st.name} 战力 ${p.power}/${st.target}（${p.baseSum}×${p.mult}）`;
    $('result').classList.add('active');
    return true;
  }
  if (forceEnd || (state.drawsLeft <= 0 && !canAnyMerge())) {
    state.phase = 'result';
    $('result-title').textContent = '功败垂成';
    $('result-body').textContent = `战力 ${p.power}/${st.target}。再试一局或合成出武将叠倍率。`;
    $('result').classList.add('active');
    return true;
  }
  return false;
}

function canAnyMerge() {
  for (let i = 0; i < SLOT_COUNT; i++) {
    if (!state.slots[i]) continue;
    for (let j = 0; j < SLOT_COUNT; j++) {
      if (i === j || !state.slots[j]) continue;
      if (tryMerge(state.slots, i, j).ok) return true;
    }
  }
  return false;
}

function startStage(idx) {
  state.stageIdx = idx;
  resetUid(1);
  state.slots = emptyBoard();
  state.drawsLeft = STAGES[idx].draws;
  state.selected = -1;
  state.phase = 'play';
  state.busy = false;
  // seed 3 chars
  for (let k = 0; k < 3; k++) {
    const s = spawnInto(state.slots);
    state.slots = s.slots;
  }
  showScreen('game');
  renderAll();
  toast(STAGES[idx].hint);
}

function nextAfterResult() {
  $('result').classList.remove('active');
  const st = STAGES[state.stageIdx];
  const p = currentPower();
  const won = p.power >= st.target;
  if (won) {
    if (state.stageIdx >= STAGES.length - 1) {
      state.phase = 'title';
      showScreen('title');
      toast('章一通关！水墨组字养成原型');
      return;
    }
    startStage(state.stageIdx + 1);
  } else {
    // retry same stage
    startStage(state.stageIdx);
  }
}

// tutorial
let tutIndex = 0;
function openTut() {
  tutIndex = 0;
  showTutStep();
  $('tutorial').classList.add('active');
}
function showTutStep() {
  const s = TUT[tutIndex];
  $('tut-steps').textContent = (tutIndex + 1) + ' / ' + TUT.length;
  $('tut-title').textContent = s.title;
  $('tut-body').textContent = s.body;
  $('btn-tut-next').textContent = tutIndex >= TUT.length - 1 ? '开始' : '下一步';
}
function finishTut() {
  localStorage.setItem(LS_TUT, '1');
  $('tutorial').classList.remove('active');
  startStage(0);
}

$('btn-start').onclick = () => {
  if (localStorage.getItem(LS_TUT) === '1') startStage(0);
  else openTut();
};
$('btn-tut-next').onclick = () => {
  if (tutIndex >= TUT.length - 1) finishTut();
  else { tutIndex++; showTutStep(); }
};
$('btn-tut-skip').onclick = finishTut;
$('btn-draw').onclick = doDraw;
$('btn-clear-sel').onclick = () => { state.selected = -1; renderAll(); };
$('btn-result').onclick = nextAfterResult;

// expose for smoke
window.SGMerge = { state, tryMerge, effectivePower, startStage, doMerge, STAGES, makeUnit };
